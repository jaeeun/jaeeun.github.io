about_content: |
  <b>Professional Summary</b><br>
  Senior Software Engineer with 14+ years across full-stack, computer vision, and real-time graphics.
  Now shipping production AI systems at Upfeat (AR/CV features, AI-orchestrated crawling pipelines, and full-stack services)
