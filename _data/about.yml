  - <b>Computer Vision & ML:</b> OpenCV, TensorFlow, PyTorch, YOLO, 3D Pose Estimation, Gesture Recognition, ARKit BlendShapes, ARCore / ARKit<br>
  - <b>AI Systems & Orchestration:</b> LLM-orchestrated pipelines, multi-container agent workflows, anti-detection headless browser automation (Camoufox), distributed / parallel data collection<br>
  - <b>DevOps & Infrastructure:</b> AWS, Docker, Firebase, Elasticsearch, FFmpeg, Git, GitLab CI/CD, Jenkins, Perforce<br>
  - <b>Graphics & Simulation:</b> OpenGL ES Renderer, Unreal Engine 4, Unity 3D, Custom Shaders (GLSL/HLSL), PBR Workflows, ROS2<br>
  - <b>Performance Tuning:</b> GPU Profiling (Adreno, Mali, Google Debugger), Memory & Frame-rate Optimization<br>
  <br>
  <b>Language :</b> Korean(Native), English(Intermediate)
