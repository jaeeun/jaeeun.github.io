<!DOCTYPE html>
<html class="no-js">
<head>
    {% include head.html %}
</head>
<body>
    {% include nav.html %}
    <!-- Header -->
    <header class="header" role="banner">
        <div class="wrapper">
            <div class="content">
                <div class="post-title">
                    <h1>{{ title }}</h1>
                    <a class="btn zoombtn" href="{{ site.url }}/">
                        <i class="fa fa-home"></i>
                    </a>
                </div>
                <div class="post-list">
                    {% assign cat_posts = collections.post | filterByTag: category %}
                    {% for post in cat_posts %}
                    <ul>
                        <li class="wow fadeInLeft" data-wow-duration="1.5s">
                            <hr style="border: outset 1px gray;">
                            <a class="zoombtn" href="{{ site.url }}{{ post.url }}">
                                {{ post.data.title }}
                                {% if post.data.img %}<img src="{{ post.data.img }}" height="20px" width="40px">{% else %}<img src="{{ site.url }}/Site/assets/img/no-image-available.jpg" height="30px" width="40px">{% endif %}
                            </a>
                        </li>
                    </ul>
                    {% endfor %}
                </div>
            </div>
        </div>
    </header>
    {% include scripts.html %}
    <script src="{{ site.url }}/Site/assets/js/wow.min.js"></script>
    <script type="text/javascript">(new WOW).init();</script>
</body>
</html>
