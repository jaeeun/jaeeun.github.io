    <meta charset="UTF-8">
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta http-equiv=X-UA-Compatible content="IE=edge,chrome=1">
    <title>{% if site.name %}{{ site.name }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
    <!-- Twitter Cards -->
    {% if feature %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ site.url }}/{{ feature }}">
    {% else %}
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="{{ site.url }}/{{ site.logo }}">
    {% endif %}
    <meta name="twitter:title" content="{% if title %}{{ title }}{% else %}{{ site.title }}{% endif %}">
    <!-- Open Graph -->
    <meta property="og:locale" content="{{ site.locale }}">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{% if title %}{{ title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:image" content="{{ site.url }}/{{ site.logo }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <link href="{{ site.url }}/feed.xml" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
    <!-- Handheld -->
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ site.url }}/Site/assets/css/main.css">
    <!-- JS -->
    <script src="{{ site.url }}/Site/assets/js/modernizr-3.3.1.custom.min.js"></script>
    <!-- Favicons -->
    <link rel="apple-touch-icon" href="{{ site.url }}/Site/assets/img/favicons/apple-icon-precomposed.png">
    <link rel="apple-touch-icon" sizes="72x72" href="{{ site.url }}/Site/assets/img/favicons/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="{{ site.url }}/Site/assets/img/favicons/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="144x144" href="{{ site.url }}/Site/assets/img/favicons/apple-icon-144x144.png">
    <link rel="shortcut icon" type="image/png" href="{{ site.url }}/Site/favicon.png" />
    <link rel="shortcut icon" href="{{ site.url }}/Site/favicon.ico" />
    <!-- Background Image -->
    {% if site.background %}
    <style type="text/css">body {background-image:url({{ site.url }}/{{ site.background }}); {% unless site.tiled_bg %} background-repeat: no-repeat; background-size: cover; {% endunless %}}</style>
    {% endif %}
    <!-- Post Feature Image -->
    {% if feature %}
    <style type="text/css">.feature {background-image:url({{ site.url }}/{{ feature }});}</style>
    {% endif %}
